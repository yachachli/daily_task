name: Publication receipt tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q daily_bets/publication_receipt.py daily_bets/analysis
