name: Delete Old Bets
on:
  schedule:
    # Run at 6 AM PST (2 PM UTC)
    - cron: "5 8 * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI
jobs:
  delete-old-bets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Delete Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          NFL_ANALYSIS_API_URL: ${{ secrets.NFL_ANALYSIS_API_URL }}
          NBA_ANALYSIS_API_URL: ${{ secrets.NBA_ANALYSIS_API_URL }}
          # Required by daily_bets.env.Env, which reads it with os.environ[...]
          # at import time. Without it this job dies before it deletes anything
          # -- it failed every night from the day the field was added.
          NBA_ALT_ANALYSIS_API_URL: ${{ secrets.NBA_ALT_ANALYSIS_API_URL }}
          MLB_ANALYSIS_API_URL: ${{ secrets.MLB_ANALYSIS_API_URL }}
          WNBA_ANALYSIS_API_URL: ${{ secrets.WNBA_ANALYSIS_API_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: uv run -m daily_bets.scripts.delete_old_bets
