name: Daily NBA Alt Bets Analysis

on:
  schedule:
    # Primary 08:15 UTC; backups recheck current markets and skip stored props.
    # GitHub cron is best-effort, including these backup triggers.
    - cron: "15 8 * * *"
    - cron: "37 11,14,17,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-app-props-publisher
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      matrix:
        sport: [nba_alt]
      fail-fast: false
    name: ${{ matrix.sport }}-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run guarded NBA app publisher (retry once on failure)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          NFL_ANALYSIS_API_URL: ${{ secrets.NFL_ANALYSIS_API_URL }}
          NBA_ANALYSIS_API_URL: ${{ secrets.NBA_ANALYSIS_API_URL }}
          NBA_ALT_ANALYSIS_API_URL: ${{ secrets.NBA_ALT_ANALYSIS_API_URL }}
          MLB_ANALYSIS_API_URL: ${{ secrets.MLB_ANALYSIS_API_URL }}
          WNBA_ANALYSIS_API_URL: ${{ secrets.WNBA_ANALYSIS_API_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          TRANSLATE_ES_URL: ${{ secrets.TRANSLATE_ES_URL }}
        run: uv run -m daily_bets ${{ matrix.sport }}

      - name: Explain exhausted recovery
        if: failure()
        run: |
          echo "::error::NBA app props publication failed. Review the Run Analysis logs and the next backup run; a green job must not be treated as proof of full slate coverage."
